openapi: 3.0.0
info:
  title: Кофе & Точка
  version: 1.0.0
security:
  - bearerAuth: [] 
tags:
  - name: Клиентское Приложение
  - name: Приложение Бариста
  - name: Административная Панель
paths:
  /auth/request-code/:
    post:
      security: []
      tags:
        - Клиентское Приложение
      summary: Запросить код подтверждения
      description: |
        Отправляет SMS с кодом подтверждения на указанный номер телефона.
        Код действителен в течение 5 минут.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  pattern: '^\+7[0-9]{10}$'
                  example: '+79161234567'
                  description: Номер телефона в формате +7XXXXXXXXXX
      responses:
        '200':
          description: Код успешно отправлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Код отправлен'
                  expires_in:
                    type: integer
                    description: Время жизни кода в секундах
                    example: 300
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          description: Слишком много попыток
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Превышено количество попыток. Попробуйте через 5 минут.'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/verify-code/:
    post:
      security: []
      tags:
        - Клиентское Приложение
      summary: Подтвердить код и получить токен
      description: |
        Проверяет код подтверждения и возвращает JWT-токен для доступа к API.
        Если пользователь с таким номером не найден — автоматически создаётся новый.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  pattern: '^\+7[0-9]{10}$'
                  example: '+79161234567'
                  description: Номер телефона
                code:
                  type: string
                  minLength: 4
                  maxLength: 6
                  example: '123456'
                  description: Код подтверждения из SMS
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Неверный код
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Неверный код подтверждения'
        '429':
          description: Слишком много попыток
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Превышено количество попыток. Попробуйте через 5 минут.'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /client/points/balance/:
    get:
      tags: 
        - Клиентское Приложение
      summary: Баланс клиента
      description: Возвращает баланс баллов клиента
      responses: 
        '200':
          description: Успешный ответ
          content: 
            application/json:
              schema:
                type: integer
                example: 12
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /client/points/history/:
    get:
      tags:
        - Клиентское Приложение
      summary: Получить историю транзакций с баллами
      description: Возвращает список операций с баллами авторизованного клиента с пагинацией
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PointTransaction'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  /client/orders/:
    get:
      tags:
        - Клиентское Приложение
      summary: Показать историю заказов авторизованного пользователя
      description: Возвращает историю заказов авторизованного пользователя с пагинацией. Заказы отсортированы по дате
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Успешный ответ, история заказов клиента найдена
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /client/orders/{id}/:
    get:
      tags:
        - Клиентское Приложение
      summary: Выводит заказ клиента по идентификатору
      description: Заказ клиента со всеми товарами и модификаторами
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: Успешный ответ, заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /client/profile/:
    get:
      tags:
        - Клиентское Приложение
      summary: Профиль пользователя
      description: Возвращает профиль авторизованного пользователя
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        
  /barista/clients/search/by-code/:
    get:
      security: []
      tags: 
        - Приложение Бариста
      summary: Найти клиента по QR-коду
      description: Метод для поиска клиента по коду, зашитому в QR
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{3}$-^[0-9]{3}'
      responses:
        '200': 
          description: Успешный ответ. Клиент найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /barista/clients/search/by-phone/:
    get:
      security: []
      tags: 
        - Приложение Бариста
      summary: Найти клиента по номеру телефона
      description: Метод для поиска клиента по номеру телефона
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            pattern: '^\7[0-9]{10}$'
            example: '79999999999'
      responses:
        '200': 
          description: Успешный ответ. Клиент найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /barista/categories/:
    get:
      security: []
      tags:
        - Приложение Бариста
      summary: Список категорий товаров
      description: Список категорий товаров
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /barista/products/:
    get:
      security: []
      tags:
        - Приложение Бариста
      summary: Список товаров
      description: Список товаров с пагинацией
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: category
          in: query
          schema:
            type: integer
            pattern: '^\7[0-9]{10}$'
            example: 101
        - name: search
          in: query
          schema:
            type: string
            example: 'абв'
        - name: sort_by
          in: query
          required: false
          description: |
            Поле для сортировки:
            - `name` — по алфавиту
            - `price` — по цене (возрастание)
            - `-price` — по цене (убывание)
            - `popular` — по популярности (убывание)
          schema:
            type: string
            enum: [name, price, -price, popular]
            default: 'name'
            example: 'popular'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /barista/products/{id}/:
    get:
      security: []
      tags:
        - Приложение Бариста
      summary: Товар
      description: Товар по идентификатору
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            pattern: '^\7[0-9]{10}$'
            example: 101
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetale'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /barista/orders/:
    post:
      tags:
        - Приложение Бариста
      summary: Сохранить заказ и начислить баллы
      description: |
        Бариста отправляет готовый заказ на сервер после оплаты.
        Система:
        - создаёт заказ в БД,
        - фиксирует цены товаров и модификаторов на момент продажи,
        - начисляет баллы клиенту,
        - обновляет баланс клиента.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderSaveRequest'
      responses:
        '201':
          description: Заказ успешно создан, баллы начислены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSaveResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Клиент с ID 123 не найден'
        '409':
          description: Конфликт (например, клиент заблокирован)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Клиент заблокирован'
        '500':
          $ref: '#/components/responses/InternalServerError'
                
  /admin/auth/login/:
    post:
      security: []
      tags:
        - Административная Панель
      summary: Вход в административную панель
      description: |
        Администратор входит в систему по email и паролю.
        Возвращает JWT-токен для доступа к API администрирования.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'admin@coffee.ru'
                  description: Email администратора
                password:
                  type: string
                  format: password
                  example: 'secure_password_123'
                  description: Пароль администратора
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Неверный email или пароль'
        '403':
          description: Доступ запрещён (аккаунт заблокирован или недостаточно прав)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Учетная запись заблокирована'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/coffee-shops/:
    post:
      tags:
        - Административная Панель
      summary: Создать новую кофейню
      description: |
        Администратор создаёт новую кофейню в системе.
        Кофейня автоматически участвует в программе лояльности.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoffeeShopCreate'
      responses:
        '201':
          description: Кофейня успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoffeeShop'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Кофейня с таким названием или адресом уже существует
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Кофейня с адресом "ул. Тверская, д. 10" уже существует'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Административная Панель
      summary: Получить список кофеен
      description: Возвращает список всех кофеен в системе с пагинацией. Администратор может фильтровать по статусу блокировки.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: is_blocked
          in: query
          required: false
          description: Фильтр по статусу блокировки
          schema:
            type: boolean
            example: false
        - name: search
          in: query
          required: false
          description: Поиск по названию или адресу
          schema:
            type: string
            maxLength: 255
            example: 'Тверская'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CoffeeShop'
                  total:
                    type: integer
                    description: Общее количество записей
                    example: 15
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/coffee-shops/{id}/:
    get:
      tags:
        - Административная Панель
      summary: Получить детали кофейни
      description: Возвращает полную информацию о кофейне по её ID. Доступно только администраторам.
      parameters:
        - name: id
          in: path
          required: true
          description: ID кофейни
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoffeeShop'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Административная Панель
      summary: Частично обновить кофейню
      description: Администратор может обновить одно или несколько полей кофейни. Поля, не переданные в запросе, остаются без изменений.
      parameters:
        - name: id
          in: path
          required: true
          description: ID кофейни
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoffeeShopUpdate'
      responses:
        '200':
          description: Кофейня успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoffeeShop'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Кофейня не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Кофейня с ID 1 не найдена'
        '409':
          description: Конфликт (дубликат названия или адреса)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Кофейня с адресом "ул. Тверская, д. 10" уже существует'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/categories/:
    post:
      tags:
        - Административная Панель
      summary: Создать новую категорию
      description: |
        Администратор создаёт новую категорию для группировки товаров.
        Категория содержит только ID и название.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Категория успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Категория с таким названием уже существует
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Категория с названием "Кофе" уже существует'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Административная Панель
      summary: Получить список категорий
      description: |
        Возвращает список всех категорий в системе.
        Доступно только администраторам.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: search
          in: query
          required: false
          description: Поиск по названию категории
          schema:
            type: string
            maxLength: 255
            example: 'Кофе'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  total:
                    type: integer
                    description: Общее количество записей
                    example: 10
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/categories/{id}/:
    patch:
      tags:
        - Административная Панель
      summary: Редактировать категорию
      description: |
        Администратор может обновить название категории.
      parameters:
        - name: id
          in: path
          required: true
          description: ID категории
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Категория успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Категория не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Категория с ID 1 не найдена'
        '409':
          description: Конфликт (дубликат названия)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Категория с названием "Кофе" уже существует'
        '500':
          $ref: '#/components/responses/InternalServerError'          
  /admin/products/:
    post:
      tags:
        - Административная Панель
      summary: Создать новый товар
      description: |
        Администратор создаёт новый товар (напиток, еда, выпечка).
        Товар автоматически становится доступен в каталоге бариста.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Товар с таким названием уже существует
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Товар с названием "Латте" уже существует'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Административная Панель
      summary: Получить список товаров
      description: |
        Возвращает список всех товаров в системе с пагинацией.
        Администратор может фильтровать по категории, статусу блокировки и искать по названию.
        Доступно только администраторам.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
        - name: category_id
          in: query
          required: false
          description: Фильтр по категории
          schema:
            type: integer
            example: 1
        - name: is_blocked
          in: query
          required: false
          description: Фильтр по статусу блокировки
          schema:
            type: boolean
            example: false
        - name: search
          in: query
          required: false
          description: Поиск по названию товара
          schema:
            type: string
            maxLength: 255
            example: 'латте'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  total:
                    type: integer
                    description: Общее количество записей (без учёта пагинации)
                    example: 45
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/products/{id}/:
    get:
      tags:
        - Административная Панель
      summary: Получить детали товара
      description: |
        Возвращает полную информацию о товаре по его ID, включая список доступных модификаторов.
        Доступно только администраторам.

      parameters:
        - name: id
          in: path
          required: true
          description: ID товара
          schema:
            type: integer
            example: 5
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetale'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Товар с ID 5 не найден'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Административная Панель
      summary: Частично обновить товар
      description: |
        Администратор может обновить одно или несколько полей товара.
        Поля, не переданные в запросе, остаются без изменений.
      parameters:
        - name: id
          in: path
          required: true
          description: ID товара
          schema:
            type: integer
            example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Товар успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Товар не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Товар с ID 5 не найден'
        '409':
          description: Конфликт (дубликат названия)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Товар с названием "Латте" уже существует'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/products/{id}/modifiers/:
    post:
      tags:
        - Административная Панель
      summary: Добавить модификатор к товару
      description: |
        Администратор добавляет существующий модификатор к товару.
        После этого модификатор будет отображаться в карточке товара 
        в приложении бариста и клиента.
      parameters:
        - name: id
          in: path
          required: true
          description: ID товара
          schema:
            type: integer
            example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - modifier_id
              properties:
                modifier_id:
                  type: integer
                  description: ID модификатора
                  example: 10
                is_default:
                  type: boolean
                  description: Модификатор по умолчанию
                  example: false
                sort_order:
                  type: integer
                  description: Порядок отображения в списке
                  example: 1
      responses:
        '201':
          description: Модификатор успешно добавлен к товару
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModifier'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Товар или модификатор не найдены
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Товар с ID 5 или модификатор с ID 10 не найден'
        '409':
          description: Модификатор уже привязан к этому товару
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Модификатор "Карамельный сироп" уже привязан к товару "Латте"'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/products/{id}/modifiers/{modifier_id}/:
    delete:
      tags:
        - Административная Панель
      summary: Удалить модификатор из товара
      description: |
        Администратор удаляет связь между товаром и модификатором.
        Модификатор перестаёт отображаться в карточке товара,
        но сам модификатор остаётся в системе.

      parameters:
        - name: id
          in: path
          required: true
          description: ID товара
          schema:
            type: integer
            example: 5
        - name: modifier_id
          in: path
          required: true
          description: ID модификатора
          schema:
            type: integer
            example: 10
      responses:
        '204':
          description: Модификатор успешно удалён из товара
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Связь не найдена
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Связь товара с модификатором не найдена'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/modifiers/:
    post:
      tags:
        - Административная Панель
      summary: Создать новый модификатор
      description: |
        Администратор создаёт новый модификатор (сироп, молоко, добавка, размер и т.д.).
        Модификатор становится доступен для привязки к товарам.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifierCreate'
      responses:
        '201':
          description: Модификатор успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modifier'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Модификатор с таким названием уже существует
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Модификатор с названием "Карамельный сироп" уже существует'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Административная Панель
      summary: Получить список модификаторов
      description: |
        Возвращает список всех модификаторов в системе с пагинацией.
