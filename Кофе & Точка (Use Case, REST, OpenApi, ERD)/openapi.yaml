      summary: Частично обновить модификатор
      description: |
        Администратор может обновить одно или несколько полей модификатора.
        Поля, не переданные в запросе, остаются без изменений.
      parameters:
        - name: id
          in: path
          required: true
          description: ID модификатора
          schema:
