  responses:
    BadRequestError:
      description: Неверный запрос
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Неверный формат параметра'
    UnauthorizedError:
      description: Не авторизован
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Требуется авторизация'
    ForbiddenError:
      description: 'Доступ запрещён'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Доступ запрещён'
    NotFoundError:
      description: 'Ресурс не найден'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Ресурс не найден'          
    InternalServerError:
      description: 'Внутренняя ошибка сервера'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Внутренняя ошибка сервера'
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: Количество записей на странице (макс. 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Смещение для пагинации
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

