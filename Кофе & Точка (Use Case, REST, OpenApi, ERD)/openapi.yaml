components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT-токен для доступа к API
  schemas:
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT-токен для доступа к API
          example: 'eyJhbGciOiJIUzI1NiIs...'
        token_type:
          type: string
          example: 'Bearer'
        expires_in:
          type: integer
          description: Время жизни токена в секундах
          example: 3600
        refresh_token:
          type: string
          description: Токен для обновления access_token
          example: 'eyJhbGciOiJIUzI1NiIs...'
        user:
          $ref: '#/components/schemas/Client'
    Client:
      type: object
      required:
        - code
        - phone
        - createDate
      properties:
        code:
          type: string
          maxLength: 16
          example: '1234567876543456'
        phone:
          type: string
          maxLength: 16
          example: "+70000000000"
        createDate:
          type: string
          format: date
          example: '2026-01-15'
    AdminAuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT-токен для доступа к API администрирования
          example: 'eyJhbGciOiJIUzI1NiIs...'
        token_type:
          type: string
          example: 'Bearer'
        expires_in:
          type: integer
          description: Время жизни токена в секундах
          example: 3600
        refresh_token:
          type: string
          description: Токен для обновления access_token
          example: 'eyJhbGciOiJIUzI1NiIs...'
        user:
          $ref: '#/components/schemas/AdminUser'
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: 'admin@coffee.ru'
        name:
          type: string
          example: 'Анна Администратор'
        role:
          type: string
          enum: [admin, superadmin]
          example: 'admin'
        is_blocked:
          type: boolean
          example: false
          
    PointTransaction:
      allOf:
        - $ref: '#/components/schemas/OrderData'
      type: object
      required:
        - transaction_type
        - count_points
        - total_points
      properties:
        transaction_type:
          type: string
          enum: [списание, начисление]
        count_points:
          type: string
          maxLength: 16
          example: "+70000000000"
        total_points:
          type: string
          maxLength: 16
          example: "+70000000000"
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderData'
      type: object
      required:
        - order_goods
      properties:
        order_goods:
          type: array
          items: 
            $ref: '#/components/schemas/ProductOrderData'
    OrderData:
      type: object
      properties:
        order_code:
          type: integer
          example: 12345
          description: Номер заказа
        order_date:
          type: string
          format: date
          example: '2026-01-15'
    ProductOrderData:
      type: object
      properties:
        product_name:
          type: string
          example: 'Латте'
        order_product_price:
          type: number
          example: '260,99'
        product_moditifires:
          type: array
          items: 
            $ref: '#/components/schemas/OrderProductModitifireData'
    OrderSaveRequest:
      type: object
      required:
        - client_id
        - coffee_shop_id
        - items
        - total
      properties:
        client_id:
          type: integer
          description: ID клиента (идентифицирован по QR или телефону)
          example: 123
        coffee_shop_id:
          type: integer
          description: ID кофейни, в которой оформляется заказ
          example: 1
        total:
          type: number
          format: float
          minimum: 0
          description: Итоговая сумма заказа (с учётом модификаторов)
          example: 680.00
        items:
          type: array
          description: Список товаров в заказе
          items:
            $ref: '#/components/schemas/OrderItemRequest'
    OrderProductModitifireData:
      type: object
      properties:
        moditifire_name:
          type: string
          example: 'Сироп карамельный'
        product_moditifire_count:
          type: integer
          default: 1
          example: 1
        product_moditifire_price:
          type: number
          example: '10,99'
          description: Цена на момент продажи
    OrderItemRequest:
      type: object
      required:
        - product_id
        - price_at_moment
      properties:
        product_id:
          type: integer
          description: ID товара
          example: 5
        price_at_moment:
          type: number
          format: float
          minimum: 0
          description: Цена товара на момент продажи
          example: 300.00
        modifiers:
          type: array
          description: Список модификаторов, добавленных к товару
          items:
            $ref: '#/components/schemas/OrderModifierRequest'    
    OrderModifierRequest:
      type: object
      required:
        - modifier_id
        - price_at_moment
      properties:
        modifier_id:
          type: integer
          description: ID модификатора
          example: 10
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Количество порций модификатора
          example: 2
        price_at_moment:
          type: number
          format: float
          minimum: 0
          description: Цена модификатора на момент продажи
          example: 50.00
    OrderSaveResponse:
      type: object
      properties:
        order_id:
          type: integer
          description: ID созданного заказа
          example: 1001
        order_number:
          type: integer
          description: Номер заказа (для печати на чеке)
          example: 101
        status:
          type: string
          enum: [paid]
          example: 'paid'
        bonuses_earned:
          type: integer
          description: Количество начисленных баллов
          example: 68
        new_balance:
          type: integer
          description: Обновлённый баланс клиента
          example: 408
        created_at:
          type: string
          format: date-time
          example: '2026-07-30T12:00:00Z'          
    Profile:
      type: object
      properties:
        client_code:
          type: string
          example: '111-111'
        phone:
          type: string
          example: '+79999999999'
        registration_date:
          type: string
          format: date
          example: '2026-01-15'
    Product:
      type: object
      properties:
        product_id:
          type: integer
          example: 103
        product_name:
          type: string
          example: 'Латте'
        product_price:
          type: number
          example: '206,99'
    Category:
      type: object
      properties:
        category_name:
          type: string
          example: 'Латте'   
        category_id:
          type: integer
          example: 101    
    Moditifire:
      type: object
      properties:
        moditifire_id:
          type: integer
          example: 102
        moditifire_name:
          type: string
          example: 'Латте'
        moditifire_price:
          type: number
          example: '206,99'
    ProductDetale:
      allOf:
        - $ref: '#/components/schemas/Product'
      properties:
        moditifires:
          type: array
          items:
            $ref: '#/components/schemas/Moditifire'
    CoffeeShopCreate:
      type: object
      required:
        - name
        - address
      properties:
        name:
          type: string
          maxLength: 255
          description: Название кофейни
          example: 'Кофейня на Тверской'
        address:
          type: string
          maxLength: 500
          description: Адрес кофейни
          example: 'г. Москва, ул. Тверская, д. 10'
    CoffeeShop:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Кофейня на Тверской'
        address:
          type: string
          example: 'г. Москва, ул. Тверская, д. 10'
        is_blocked:
          type: boolean
          example: false  
    CoffeeShopUpdate:
      type: object
      description: Поля для обновления кофейни (все опциональны)
      properties:
        name:
          type: string
          maxLength: 255
          description: Название кофейни
          example: 'Обновлённая кофейня'
        address:
          type: string
          maxLength: 500
